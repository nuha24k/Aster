[package]
name = "aster-sidecar"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "aster-core"
path = "src/main.rs"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"

aster-core = { path = "../aster-core" }
aster-terminal = { path = "../aster-terminal" }
aster-git = { path = "../aster-git" }
aster-editor = { path = "../aster-editor" }
aster-config = { path = "../aster-config" }
