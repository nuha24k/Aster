[package]
name = "aster-tauri-app"
version = "0.1.0"
description = "ASTER Developer Workspace Tauri App"
authors = ["ASTER Team"]
license = "MIT"
repository = ""
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "aster_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tokio = { version = "1.0", features = ["full"] }
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-dialog = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
dirs = "5"
thiserror = "2"



aster-core = { path = "../crates/aster-core" }
aster-terminal = { path = "../crates/aster-terminal" }
aster-git = { path = "../crates/aster-git" }
aster-editor = { path = "../crates/aster-editor" }
aster-config = { path = "../crates/aster-config" }
